name: PR Screenshots

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Take screenshots
        run: node scripts/take-screenshots.mjs

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

      - name: Comment on PR with inline screenshots
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const screenshotDir = 'screenshots';
            const files = fs.readdirSync(screenshotDir).filter(f => f.endsWith('.png'));

            if (files.length === 0) {
              console.log('No screenshots found');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Get repo ID needed for the upload API
            const { data: repoData } = await github.rest.repos.get({ owner, repo });

            const uploadedUrls = {};

            for (const file of files) {
              const filePath = path.join(screenshotDir, file);
              const content = fs.readFileSync(filePath);
              const stats = fs.statSync(filePath);

              try {
                // Step 1: Request an upload policy from GitHub's user-content storage
                const policyRes = await fetch('https://github.com/upload/policies/assets', {
                  method: 'POST',
                  headers: {
                    'Authorization': `token ${process.env.GITHUB_TOKEN}`,
                    'Accept': 'application/json',
                    'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({
                    name: file,
                    size: stats.size,
                    content_type: 'image/png',
                    repository_id: repoData.id,
                  }),
                });

                if (!policyRes.ok) {
                  const text = await policyRes.text();
                  throw new Error(`Policy request failed (${policyRes.status}): ${text}`);
                }

                const policy = await policyRes.json();

                // Step 2: Upload the image to the signed URL
                const form = new FormData();
                for (const [key, value] of Object.entries(policy.form)) {
                  form.append(key, value);
                }
                form.append('file', new Blob([content], { type: 'image/png' }), file);

                const uploadRes = await fetch(policy.upload_url, {
                  method: 'POST',
                  body: form,
                });

                if (!uploadRes.ok) {
                  throw new Error(`Upload failed (${uploadRes.status})`);
                }

                // Step 3: The asset href is the permanent, publicly-accessible URL
                uploadedUrls[file] = policy.asset.href;
                console.log(`Uploaded ${file} -> ${policy.asset.href}`);
              } catch (err) {
                console.log(`Warning: upload failed for ${file}: ${err.message}`);
                uploadedUrls[file] = null;
              }
            }

            // Build the comment body
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const imageMarkdown = files.map(f => {
              const name = f.replace('.png', '').replace(/-/g, ' ');
              const url = uploadedUrls[f];
              if (url) {
                return `### ${name}\n![${name}](${url})`;
              }
              return `### ${name}\n*(upload failed — view in [artifacts](${runUrl}))*`;
            }).join('\n\n');

            const body = [
              '## App Screenshots',
              '',
              imageMarkdown,
              '',
              `> Taken at ${new Date().toISOString()} | [Download all](${runUrl})`
            ].join('\n');

            // Find existing bot comment to update (avoid duplicate comments)
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: context.issue.number,
            });

            const marker = '## App Screenshots';
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.issue.number,
                body,
              });
            }
