name: PR Screenshots

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Take screenshots
        run: node scripts/take-screenshots.mjs

      - name: Commit and push screenshots
        id: screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f screenshots/
          git commit -m "Update PR screenshots [skip ci]" || echo "No changes to commit"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const screenshotDir = 'screenshots';
            const files = fs.readdirSync(screenshotDir).filter(f => f.endsWith('.png'));

            if (files.length === 0) {
              console.log('No screenshots found');
              return;
            }

            const sha = '${{ steps.screenshots.outputs.sha }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const imageMarkdown = files.map(f => {
              const name = f.replace('.png', '').replace(/-/g, ' ');
              const url = `https://raw.githubusercontent.com/${owner}/${repo}/${sha}/screenshots/${f}`;
              return `### ${name}\n![${name}](${url})`;
            }).join('\n\n');

            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              '## App Screenshots',
              '',
              imageMarkdown,
              '',
              `> Taken at ${new Date().toISOString()} | [View artifacts](${runUrl})`
            ].join('\n');

            // Find existing bot comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: context.issue.number,
            });

            const marker = '## App Screenshots';
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.issue.number,
                body,
              });
            }
